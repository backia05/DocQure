# frontend/nginx/nginx.conf

server {
    listen 80;
    server_name localhost;

    # The root directory where Nginx will find our React app
    root /usr/share/nginx/html;
    index index.html index.htm;

    # This is the crucial part for React Router
    location / {
        # Try to serve the requested file, then a directory,
        # and if neither exists, fall back to serving index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}